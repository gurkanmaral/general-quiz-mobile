name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The contracts and streak rules are copies of the backend's; fail when they drift.
      - uses: actions/checkout@v4
        with:
          repository: gurkanmaral/general-quiz-backend
          path: general-quiz-backend
      - run: node scripts/check-shared-sync.mjs general-quiz-backend && rm -rf general-quiz-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
